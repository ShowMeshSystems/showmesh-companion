name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: The tag matches the application version
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match application version ${version}."
            exit 1
          }
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --target universal-apple-darwin
      - name: Publish an unsigned pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)"
          shasum -a 256 "${dmg}" | tee checksum.txt
          gh release create "${GITHUB_REF_NAME}" "${dmg}" \
            --prerelease \
            --title "ShowMesh Companion ${GITHUB_REF_NAME#v}" \
            --notes-file docs/release-notes/${GITHUB_REF_NAME}.md
